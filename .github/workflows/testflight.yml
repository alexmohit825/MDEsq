name: Deploy MDEsq Native iOS to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'MDEsq/**'
      - 'MDEsq.xcodeproj/**'
      - '.github/workflows/testflight.yml'

jobs:
  build-and-deploy:
    name: Build & Deliver to TestFlight
    runs-on: macos-15

    env:
      BUNDLE_ID: "com.dramohit.mdesq"
      APP_NAME: "MDEsq"
      APPLE_KEY_ID: "38F6WA87DU"
      APPLE_ISSUER_ID: "73c7355a-beef-4d79-919d-c3d7dec7747a"
      APPLE_TEAM_ID: "523MJL63MC"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8

      - name: Dynamic Build Number Injection
        run: |
          xcrun agvtool new-version -all ${{ github.run_number }}
          xcrun agvtool new-marketing-version "1.0.0"

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project MDEsq.xcodeproj \
            -scheme MDEsq \
            -destination "generic/platform=iOS" \
            -archivePath build/MDEsq.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8 \
            -authenticationKeyID ${{ env.APPLE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ env.APPLE_ISSUER_ID }} \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=${{ env.APPLE_TEAM_ID }}

      - name: Export IPA
        run: |
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ env.APPLE_TEAM_ID }}</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/MDEsq.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/IPA \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8 \
            -authenticationKeyID ${{ env.APPLE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ env.APPLE_ISSUER_ID }}

      - name: Upload IPA to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/IPA/MDEsq.ipa \
            --apiKey ${{ env.APPLE_KEY_ID }} \
            --apiIssuer ${{ env.APPLE_ISSUER_ID }}
